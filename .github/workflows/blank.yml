# Builds a signed IPA and uploads to TestFlight after merge.
# Required secrets: APPLE_ID, APPLE_TEAM_ID, APP_SPECIFIC_PASSWORD, BUNDLE_ID,
# CERTIFICATE_P12_BASE64, CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD,
# PROVISIONING_PROFILE_BASE64, PROVISIONING_PROFILE_NAME
name: Release TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  XCODE_PROJECT: SIGamingSDK/SIGamingSDK.xcodeproj
  XCODE_SCHEME: SIGamingSDKExample
  ARCHIVE_PATH: ${{ runner.temp }}/SIGamingSDKExample.xcarchive
  EXPORT_PATH: ${{ runner.temp }}/export
  EXPORT_OPTIONS_PATH: ${{ runner.temp }}/ExportOptions.plist
  IPA_PATH: ${{ runner.temp }}/export/SIGamingSDKExample.ipa

jobs:
  testflight:
    runs-on: macos-15
    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Validate required secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_ID \
            APPLE_TEAM_ID \
            APP_SPECIFIC_PASSWORD \
            BUNDLE_ID \
            CERTIFICATE_P12_BASE64 \
            CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            PROVISIONING_PROFILE_BASE64 \
            PROVISIONING_PROFILE_NAME
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required secrets are present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set build number
        run: |
          set -euo pipefail
          echo "Build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          if [ ! -s "$CERT_PATH" ]; then
            echo "::error::Certificate decode failed. Check CERTIFICATE_P12_BASE64."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "Installed signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          if [ ! -s "$PP_PATH" ]; then
            echo "::error::Provisioning profile decode failed. Check PROVISIONING_PROFILE_BASE64."
            exit 1
          fi

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          PROFILE_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")" | sed 's/^[^.]*\.//')

          echo "Profile name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile bundle: $PROFILE_BUNDLE"

          if [ "$PROFILE_BUNDLE" != "$BUNDLE_ID" ]; then
            echo "::warning::Profile bundle ID ($PROFILE_BUNDLE) does not match secret BUNDLE_ID ($BUNDLE_ID)."
          fi

          mkdir -p "$PP_DIR"
          cp "$PP_PATH" "$PP_DIR/$PROFILE_UUID.mobileprovision"

      - name: Archive app
        env:
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME"

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "::error::Archive was not created at $ARCHIVE_PATH"
            exit 1
          fi
          echo "Archive created successfully."

      - name: Create ExportOptions.plist
        env:
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > "$EXPORT_OPTIONS_PATH" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist:"
          plutil -p "$EXPORT_OPTIONS_PATH"

      - name: Export IPA
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$EXPORT_PATH"

          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA not found at $IPA_PATH"
            echo "Export directory contents:"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi

          echo "IPA exported successfully:"
          ls -lh "$IPA_PATH"

      - name: Validate IPA before upload
        run: |
          set -euo pipefail
          unzip -l "$IPA_PATH" | head -20
          echo "IPA size: $(du -h "$IPA_PATH" | cut -f1)"

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --verbose

      - name: Release summary
        run: |
          {
            echo "### TestFlight upload complete"
            echo "- App: \`$XCODE_SCHEME\`"
            echo "- Version: \`1.0.0\`"
            echo "- Build number: \`$BUILD_NUMBER\`"
            echo "- Bundle ID: \`$BUNDLE_ID\`"
            echo "- IPA: \`$IPA_PATH\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Triggered by: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
